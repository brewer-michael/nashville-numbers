[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nashville-numbers"
dynamic = ["version"]
description = "Listens to live music and shows the chords as Nashville numbers on an LCD or LED display"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.optional-dependencies]
# live audio input (needs the PortAudio library: apt install libportaudio2)
audio = ["sounddevice>=0.4.6"]
# display and button hardware on a Raspberry Pi
pi = ["gpiozero>=2.0", "RPLCD>=1.3", "smbus2>=0.4", "spidev>=3.5"]
dev = ["pytest>=7", "ruff>=0.4", "gpiozero>=2.0", "RPLCD>=1.3", "smbus2>=0.4"]

[project.scripts]
nashville-numbers = "nashville_numbers.cli:main"

[tool.setuptools.dynamic]
version = {attr = "nashville_numbers.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"hardware/wiring/tools/*" = ["E501"]   # colour and connection tables
