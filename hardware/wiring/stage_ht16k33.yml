  - description: Dupont jumper wire F-F 2.54 mm, 20 cm, orange
    qty: 1
    unit: pcs
    designators: [W1]
  - description: Dupont jumper wire F-F 2.54 mm, 20 cm, red
    qty: 1
    unit: pcs
    designators: [W1]
  - description: Dupont jumper wire F-F 2.54 mm, 20 cm, white
    qty: 1
    unit: pcs
    designators: [W3]
  - description: Dupont jumper wire F-F 2.54 mm, 20 cm, yellow
    qty: 1
