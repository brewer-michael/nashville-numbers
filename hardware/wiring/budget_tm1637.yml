# Nashville Numbers v2 - Budget build: TM1637 4-digit 7-segment module and panel button,
# plus the OPTIONAL footswitch jack (shaded; the stage wedge has the jack hole)
#
# WireViz 0.4.1 harness.  Source of truth: hardware/SPEC.md sections 1, 3.1, 3.4, 3.5.
# Rendered and checked by tools/build.sh (tools/check_wiring.py compares every
# wire below with tools/wiring_data.py).  Pin numbers are physical header pins,
# GPIO numbers are BCM.  Wire colours: see README.md "Wire colour scheme".

metadata:
  title: Nashville Numbers v2 - Budget build (TM1637)

options:
  color_mode: full

tweak:
  append:
    - 'graph [ranksep="1.0"]'
    - 'labelloc="t"'
    - 'labeljust="l"'
    - 'fontsize="22"'
    - 'label=<<b>Budget build: TM1637 4-digit 7-segment module, panel button, optional footswitch jack</b><br align="left"/><font point-size="13">Raspberry Pi 5 / Pi 4. Physical header pin numbers, BCM GPIO names. Power off before wiring. Source: hardware/SPEC.md §1, §3.1, §3.4, §3.5</font><br align="left"/><font point-size="13">Wire colours: orange 3.3 V · black GND · violet (purple) TM1637 CLK · grey TM1637 DIO · green panel button (GPIO17) · white footswitch (GPIO27)</font><br align="left"/><font point-size="13">Shaded parts (W3, SPLICE, R1, C1, JACK) are the OPTIONAL footswitch, wired exactly as in the Stage build. Dashed line = component lead soldered directly, no wire.</font><br align="left"/><font point-size="13" color="#c92a2a"><b>TM1637 VCC goes to 3.3 V (pin 17), never 5 V: the module pulls CLK and DIO up to its VCC.</b></font><br align="left"/>>'

connectors:
  PI:
    type: Raspberry Pi 5 / Pi 4, 40-pin GPIO header
    subtype: 2x20 male, 2.54 mm
    pincount: 40
    pinlabels: [3V3, 5V, GPIO2 SDA, 5V, GPIO3 SCL, GND, GPIO4, GPIO14 TXD, GND, GPIO15 RXD,
                GPIO17, GPIO18, GPIO27, GND, GPIO22, GPIO23, 3V3, GPIO24, GPIO10 MOSI, GND,
                GPIO9 MISO, GPIO25, GPIO11 SCLK, GPIO8 CE0, GND, GPIO7 CE1, GPIO0 ID_SD, GPIO1 ID_SC, GPIO5, GND,
                GPIO6, GPIO12, GPIO13, GND, GPIO19, GPIO16, GPIO26, GPIO20, GND, GPIO21]
    hide_disconnected_pins: true
    ignore_in_bom: true
    notes: |-
      Pin 1 = square pad, microSD-card end.
      Only the pins used by this build are shown.
  TM1637:
    type: TM1637 4-digit 7-segment module, red
    subtype: 0.56-inch (or 0.36-inch)
    pinlabels: [CLK, DIO, VCC, GND]
    show_pincount: false
    notes: |-
      VCC = 3.3 V only (10 kΩ pull-ups to VCC).
      Header order varies by vendor: wire by the printed labels.
  BUTTON:
    type: Panel button, 16 mm momentary, normally open
    subtype: solder lugs or screw terminals
    pins: [C, 'NO']
    pinlabels: [common, normally open]
    show_pincount: false
    notes: 2-lug switch - either way round. 3-lug switch - use C and NO, leave NC free.
  SPLICE:
    style: simple
    show_name: true
    type: "OPTIONAL: solder splice at the jack"
    subtype: white lead + R1 + C1
    bgcolor: "#fff3bf"
    ignore_in_bom: true
    notes: Under 3.2 mm heat-shrink.
  R1:
    style: simple
    show_name: true
    type: "OPTIONAL: resistor 1 kΩ, 0.25 W"
    subtype: other lead into the TIP lug
    bgcolor: "#fff3bf"
    ignore_in_bom: true
  C1:
    style: simple
    show_name: true
    type: "OPTIONAL: capacitor 100 nF, ceramic"
    subtype: other lead into the SLEEVE lug
    bgcolor: "#fff3bf"
    ignore_in_bom: true
  JACK:
    type: "OPTIONAL: 1/4-inch (6.35 mm) mono TS jack, open frame"
    subtype: solder lugs
    pins: [T, S]
    pinlabels: [tip, sleeve]
    show_pincount: false
    bgcolor: "#fff3bf"
    notes: |-
      Optional footswitch (SPEC.md 1). Any momentary pedal.
      Extra switch lug, if present: leave free.

cables:
  W1:
    category: bundle
    type: Dupont jumper F-F
    gauge: 26 AWG
    length: 0.2
    colors: [VT, GY, OG, BK]
    ignore_in_bom: true
    notes: Pi to TM1637 module
  W2:
    category: bundle
    type: Dupont jumper F-F, far housing cut off
    gauge: 26 AWG
    length: 0.2
    colors: [BK, GN]
    ignore_in_bom: true
    notes: |-
      Female housing on the Pi. Button end: strip 5 mm,
      solder to the lug under 4.8 mm heat-shrink, or clamp in the screw terminal.
  W3:
    category: bundle
    type: Dupont jumper F-F, far housing cut off
    gauge: 26 AWG
    length: 0.2
    colors: [WH, BK]
    bgcolor: "#fff3bf"
    ignore_in_bom: true
    notes: |-
      OPTIONAL footswitch leads. Female housing on the Pi. Trim to about 15 cm.
      White: ends in the splice with R1 and C1 (3.2 mm heat-shrink).
      Black: SLEEVE lug, shared with C1 (4.8 mm heat-shrink).

connections:
  -
    - PI: [16, 18, 17, 20]
    - W1: [1-4]
    - TM1637: [CLK, DIO, VCC, GND]
  -
    - PI: [9, 11]
    - W2: [1-2]
    - BUTTON: [C, 'NO']
  -
    - PI: [13]
    - W3: [1]
    - SPLICE
  -
    - SPLICE
    - --
    - R1
    - --
    - JACK: [T]
  -
    - SPLICE
    - --
    - C1
    - --
    - JACK: [S]
  -
    - PI: [14]
    - W3: [2]
    - JACK: [S]

